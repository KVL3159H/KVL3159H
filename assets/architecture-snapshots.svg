<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545">
<rect width="1200" height="545" fill="#ffffff"/>
<style>
.h{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#d90429}
.tt{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#24292f}
.st{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#57606a}
.box{fill:#ffffff;stroke:#d90429;stroke-width:2}
.arrow{stroke:#d90429;stroke-width:2;fill:none;marker-end:url(#a)}
</style>
